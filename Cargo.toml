[package]
name = "literati"
version = "0.1.0"
edition = "2021"

[lib]
name = "literati"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is intentionally NOT enabled here. It is added at build time
# only for the cdylib target, via `[tool.maturin] features` in pyproject.toml.
# pyo3's extension-module feature omits libpython at link time (the symbols are
# resolved by the Python interpreter that loads the .so), which is correct for
# the cdylib but breaks linking any [[bin]] target in this crate since a standalone executable has no interpreter to
# supply those symbols. Plain `cargo build`/`cargo test` therefore build pyo3
# without extension-module (bins + rlib work), while `maturin build`/`develop`
# pass `--features pyo3/extension-module` to get the real Python extension.
pyo3 = { version = "0.23" }
numpy = "0.23"
ndarray = "0.16"
ordered-float = "4"
rand = "0.8"
rand_chacha = "0.3"
slab = "0.4"
rayon = "1.10"

[dev-dependencies]
static_assertions = "1"
