[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "literati"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "psutil",
    "ucimlrepo",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "literati._engine"
features = ["pyo3/extension-module"]
